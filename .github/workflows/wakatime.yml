name: Update WakaTime Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch WakaTime data and update README
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');

            const endpoints = {
              languages: 'https://wakatime.com/share/@Sierra117/bb9729ad-9cb3-4d6c-b912-359e136ed48a.json',
              editors: 'https://wakatime.com/share/@Sierra117/7cab5d5a-187a-4687-9e05-db05c975bf68.json',
              os: 'https://wakatime.com/share/@Sierra117/8bb890bb-0128-4bb0-adaa-def4d63aa689.json',
              categories: 'https://wakatime.com/share/@Sierra117/bdfc68ea-2e02-4fef-8870-5f648645152a.json',
              summary: 'https://wakatime.com/share/@Sierra117/ca964aaa-fcd3-4f9b-ad9b-855b90cb5ae4.json',
            };

            const logoSlugs = {
              'python': 'python',
              'java': 'java',
              'javascript': 'javascript',
              'html': 'html5',
              'css': 'css3',
              'c': 'c',
              'c++': 'cplusplus',
              'go': 'go',
              'rust': 'rust',
              'bash': 'bash',
              'typescript': 'typescript',
              'ruby': 'ruby',
              'php': 'php',
              'swift': 'swift',
              'kotlin': 'kotlin',
              'r': 'r',
              'scala': 'scala',
              'perl': 'perl',
              'lua': 'lua',
              'dart': 'dart',
              'markdown': 'markdown',
              'xml': 'xml',
              'json': 'json',
              'yaml': 'yaml',
              'sql': 'mysql',
              'arduino': 'arduino',
              'processing': 'processingfoundation',
              'nasm': 'nasm',
              'brainfuck': 'brainfuck',
              'linux': 'linux',
              'windows': 'windows',
              'mac': 'apple',
              'firefox': 'firefoxbrowser',
              'vs code': 'visualstudiocode',
              'chrome': 'googlechrome',
              'android studio': 'androidstudio',
              'intellij idea': 'intellijidea',
              'atom': 'atom',
              'pycharm': 'pycharm',
              'clion': 'clion',
              'sublime text': 'sublimetext',
              'webstorm': 'webstorm',
              'eclipse': 'eclipseide',
              'zed': 'zed',
              'google calendar': 'googlecalendar',
              'zoom': 'zoom',
              'meeting': 'googlemeet',
              'designing': 'figma'
            };

            function normalizeName(name) {
              if (name === 'Other') return 'Unclassified';
              if (name === 'Unknown OS') return 'Android';
              if (name === 'Unknown Editor') return 'Terminal';
              return name;
            }

            async function fetchJSON(url) {
              const res = await fetch(url);
              const text = await res.text();
              const jsonStr = text.replace(/^[^{[{]*/, '').replace(/[^}\]]*$/, '');
              const parsed = JSON.parse(jsonStr);
              if (parsed.error) {
                console.warn(`WakaTime endpoint returned error: ${parsed.error} (${url})`);
                return null;
              }
              return parsed;
            }

            function buildSummary(data) {
              const gt = data.grand_total;
              const best = data.best_day;
              const range = data.range;

              let md = `### ⏱️ Coding Activity\n\n`;
              md += `| ⏱️ Total | 📅 Daily Average | 🏆 Best Day | 🚀 Since | 📆 Days |\n`;
              md += `|:---------|:-----------------|:------------|:---------|:-------|\n`;
              md += `| ${gt.human_readable_total_including_other_language} | ${gt.human_readable_daily_average_including_other_language} | ${best.date} — ${best.text} | ${range.start.split('T')[0]} | ${range.days_including_holidays} |\n\n`;
              return md;
            }

            function buildTable(title, emoji, data) {
              let md = `### ${emoji} ${title}\n\n`;
              md += `<table style="width: 100%; border-collapse: collapse; table-layout: fixed; text-align: left;">\n`;
              md += `<tr><th align="left">Name</th><th align="right" style="width: 180px;">Hours</th></tr>\n`;

              for (const item of data) {
                const name = normalizeName(item.name);
                md += `<tr><td><b>${name}</b></td><td align="right">${item.text}</td></tr>\n`;
              }

              md += `</table>\n\n`;
              return md;
            }

            try {
              const [langData, editorData, osData, catData, summaryData] = await Promise.all([
                fetchJSON(endpoints.languages),
                fetchJSON(endpoints.editors),
                fetchJSON(endpoints.os),
                fetchJSON(endpoints.categories),
                fetchJSON(endpoints.summary),
              ]);

              const sections = [];
              if (summaryData && summaryData.data) sections.push(buildSummary(summaryData.data));
              if (langData && langData.data) sections.push(buildTable('Languages', '💻', langData.data));
              if (editorData && editorData.data) sections.push(buildTable('Editors', '🖥️', editorData.data));
              if (osData && osData.data) sections.push(buildTable('Operating Systems', '🐧', osData.data));
              if (catData && catData.data) sections.push(buildTable('Categories', '📊', catData.data));

              if (sections.length === 0) {
                core.setFailed('All WakaTime endpoints returned errors. No data to write.');
                return;
              }

              const content = sections.join('\n');

              let readme = fs.readFileSync('README.md', 'utf8');

              const startMarker = '<!-- WAKATIME:START -->';
              const endMarker = '<!-- WAKATIME:END -->';

              const block = `${startMarker}\n${content}\n${endMarker}`;

              if (readme.includes(startMarker) && readme.includes(endMarker)) {
                readme = readme.replace(
                  new RegExp(`${startMarker}[\\s\\S]*?${endMarker}`),
                  block
                );
              } else {
                readme = `${block}\n\n${readme}`;
              }

              fs.writeFileSync('README.md', readme);
              console.log('README.md updated successfully.');
            } catch (error) {
              console.error('Failed to update README:', error);
              core.setFailed(error.message);
            }

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md && echo "No changes to commit" && exit 0
          git add README.md
          git commit -m "docs(readme): auto-update WakaTime coding stats"
          git push

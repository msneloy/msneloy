name: Update WakaTime Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch WakaTime data and update README
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');

            const endpoints = {
              languages: 'https://wakatime.com/share/@Sierra117/bb9729ad-9cb3-4d6c-b912-359e136ed48a.json',
              editors: 'https://wakatime.com/share/@Sierra117/7cab5d5a-187a-4687-9e05-db05c975bf68.json',
              os: 'https://wakatime.com/share/@Sierra117/8bb890bb-0128-4bb0-adaa-def4d63aa689.json',
              categories: 'https://wakatime.com/share/@Sierra117/bdfc68ea-2e02-4fef-8870-5f648645152a.json',
              summary: 'https://wakatime.com/share/@Sierra117/ca964aaa-fcd3-4f9b-ad9b-855b90cb5ae4.json',
            };

            const icons = {
              languages: '💻', editors: '🖥️', os: '🐧', categories: '📊',
              total: '⏱️', daily: '📅', best: '🏆', since: '🚀', days: '📆',
              python: '🐍', java: '☕', javascript: '📜', html: '🌐', css: '🎨',
              c: '⚙️', 'c++': '⚙️', go: '🔵', rust: '🦀', bash: '🐚',
              linux: '🐧', windows: '🪟', mac: '🍎', firefox: '🦊', 'vs code': '💙',
              chrome: '🌐', 'android studio': '🤖', coding: '💻', browsing: '🌐',
              'ai coding': '🤖', meeting: '📹', 'writing docs': '📝', debugging: '🐛',
            };

            function getIcon(name) {
              const lower = name.toLowerCase();
              return icons[lower] || '•';
            }

            async function fetchJSON(url) {
              const res = await fetch(url);
              const text = await res.text();
              const jsonStr = text.replace(/^[^{[{]*/, '').replace(/[^}\]]*$/, '');
              const parsed = JSON.parse(jsonStr);
              if (parsed.error) {
                console.warn(`WakaTime endpoint returned error: ${parsed.error} (${url})`);
                return null;
              }
              return parsed;
            }

            function pieChartUrl(title, data, width = 400, height = 200) {
              const top = data.slice(0, 8);
              const rest = data.slice(8);
              const labels = top.map(d => d.name);
              const values = top.map(d => parseFloat(d.percent.toFixed(1)));
              const colors = top.map(d => d.color.replace('#', ''));

              if (rest.length > 0) {
                const otherPct = rest.reduce((s, d) => s + d.percent, 0);
                labels.push(`Other (${rest.length})`);
                values.push(parseFloat(otherPct.toFixed(1)));
                colors.push('808080');
              }

              const config = {
                type: 'doughnut',
                data: {
                  labels: labels,
                  datasets: [{
                    data: values,
                    backgroundColor: colors.map(c => '#' + c),
                    borderColor: 'ffffff',
                    borderWidth: 2,
                  }]
                },
                options: {
                  plugins: {
                    title: { display: true, text: title, color: 'ffffff', font: { size: 16 } },
                    legend: { position: 'right', labels: { color: 'ffffff', padding: 8, font: { size: 11 } } },
                  },
                  layout: { padding: 10 },
                }
              };

              return 'https://quickchart.io/chart?c=' + encodeURIComponent(JSON.stringify(config)) + `&w=${width}&h=${height}&bkg=0d1117`;
            }

            function buildSummary(data) {
              const gt = data.grand_total;
              const best = data.best_day;
              const range = data.range;
              const since = range.start.split('T')[0];

              let md = `### ⏱️ Coding Activity\n\n`;
              md += `<p align="center">\n\n`;
              md += `![Total](https://img.shields.io/badge/⏱️_Total-${encodeURIComponent(gt.human_readable_total)}-blue?style=for-the-badge) `;
              md += `![Daily](https://img.shields.io/badge/📅_Daily_Avg-${encodeURIComponent(gt.human_readable_daily_average)}-green?style=for-the-badge) `;
              md += `![Best](https://img.shields.io/badge/🏆_Best_Day-${encodeURIComponent(best.text)}-gold?style=for-the-badge)\n\n`;
              md += `![Since](https://img.shields.io/badge/🚀_Since-${since}-purple?style=for-the-badge) `;
              md += `![Days](https://img.shields.io/badge/📆_Days-${range.days_including_holidays}-orange?style=for-the-badge)\n\n`;
              md += `</p>\n`;
              return md;
            }

            function buildPieSection(title, emoji, data) {
              const chartUrl = pieChartUrl(`${emoji} ${title}`, data);
              let md = `### ${emoji} ${title}\n\n`;
              md += `<p align="center">\n\n`;
              md += `![${title} Chart](${chartUrl})\n\n`;
              md += `</p>\n\n`;
              md += `<details>\n<summary>📋 Full ${title} Breakdown</summary>\n\n`;
              md += `| | Name | Hours | Percent |\n`;
              md += `|---|-----:|------:|--------:|\n`;

              for (const item of data) {
                const icon = getIcon(item.name);
                const pct = item.percent.toFixed(1);
                md += `| ${icon} | **${item.name}** | ${item.text} | ${pct}% |\n`;
              }

              md += `\n</details>\n`;
              return md;
            }

            try {
              const [langData, editorData, osData, catData, summaryData] = await Promise.all([
                fetchJSON(endpoints.languages),
                fetchJSON(endpoints.editors),
                fetchJSON(endpoints.os),
                fetchJSON(endpoints.categories),
                fetchJSON(endpoints.summary),
              ]);

              const sections = [];
              if (summaryData && summaryData.data) sections.push(buildSummary(summaryData.data));
              if (langData && langData.data) sections.push(buildPieSection('Languages', '💻', langData.data));
              if (editorData && editorData.data) sections.push(buildPieSection('Editors', '🖥️', editorData.data));
              if (osData && osData.data) sections.push(buildPieSection('Operating Systems', '🐧', osData.data));
              if (catData && catData.data) sections.push(buildPieSection('Categories', '📊', catData.data));

              if (sections.length === 0) {
                core.setFailed('All WakaTime endpoints returned errors. No data to write.');
                return;
              }

              const content = sections.join('\n');

              let readme = fs.readFileSync('README.md', 'utf8');

              const startMarker = '<!-- WAKATIME:START -->';
              const endMarker = '<!-- WAKATIME:END -->';

              const block = `${startMarker}\n${content}\n${endMarker}`;

              if (readme.includes(startMarker) && readme.includes(endMarker)) {
                readme = readme.replace(
                  new RegExp(`${startMarker}[\\s\\S]*?${endMarker}`),
                  block
                );
              } else {
                readme = `${block}\n\n${readme}`;
              }

              fs.writeFileSync('README.md', readme);
              console.log('README.md updated successfully.');
            } catch (error) {
              console.error('Failed to update README:', error);
              core.setFailed(error.message);
            }

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md && echo "No changes to commit" && exit 0
          git add README.md
          git commit -m "docs(readme): auto-update WakaTime coding stats"
          git push
